name: CI

on:
    push:
        branches: ["**"]
    pull_request:

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install root deps
              run: npm ci

            - name: Typecheck core
              run: npm run typecheck

            - name: Build core
              run: npm run build

            - name: Run core tests
              run: npm test

            - name: Install web deps
              run: npm --prefix web ci

            - name: Build web
              run: npm run web:build
